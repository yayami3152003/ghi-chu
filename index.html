<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ghi chú</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#081113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghi chú">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap">
<script src="https://cdn.lordicon.com/lordicon.js"></script>
<style>
/* Layout: dashboard như ảnh mẫu 1 (thanh menu dọc trái, lời chào + nút tròn trên đầu, thẻ lớn + cột hạn mức, cột thống kê vòng tròn bên phải);
   trên điện thoại menu chuyển xuống thanh dưới cùng. Màu: kính xanh ngọc tối như ảnh mẫu 2. */
:root{
  color-scheme:dark;
  --bg:#081113; --bg-2:#0C1A1D;
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.075); --glass-line:rgba(255,255,255,.09); --glass-hi:rgba(255,255,255,.16);
  --ink:#E7F3F1; --muted:#8EA8A5; --faint:#5F7A77;
  --accent:#36D6C4; --accent-2:#1C9DB7; --accent-ink:#04201D; --accent-soft:rgba(54,214,196,.14);
  --grad:linear-gradient(135deg,#3BE0CB 0%,#22A9C2 100%);
  --hero-grad:linear-gradient(135deg,rgba(36,170,160,.55) 0%,rgba(18,82,98,.55) 55%,rgba(14,40,58,.6) 100%);
  --in:#63E4A4; --out:#FF8B7B; --warn:#F2C46B; --on-warn:#1E1404;
  --in-soft:rgba(99,228,164,.13); --out-soft:rgba(255,139,123,.13); --warn-soft:rgba(242,196,107,.13);
  --c-an:#F4A259; --c-dilai:#62B6F0; --c-muasam:#E987B8; --c-hoadon:#E8C65A; --c-nha:#A699F5; --c-suckhoe:#F47C6C;
  --c-giaitri:#4FD6D0; --c-hoctap:#8AA2FA; --c-giadinh:#EA9A62; --c-khac:#9DB2AD; --c-caulong:#B4DE6A;
  --c-luong:#63E4A4; --c-thuong:#6FDDB0; --c-banhang:#93D477; --c-dautu:#4FD1C0; --c-duoccho:#A6D47A;
  --shadow:0 20px 50px rgba(0,0,0,.35);
  --scrim:rgba(2,8,9,.6);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --r:22px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 600px at 85% -10%,rgba(28,157,183,.28),transparent 60%),
    radial-gradient(700px 500px at -10% 30%,rgba(54,214,196,.16),transparent 60%),
    radial-gradient(800px 600px at 60% 110%,rgba(30,90,140,.25),transparent 60%),
    var(--bg);
  background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
lord-icon{display:block;flex:none}

/* kính */
.glass,.card,.hero,.gate-card,.sheet,.rail,.remind,.demo-bar,.note{backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h3{margin:0;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em}
.card-head p{margin:0;font-size:12.5px;color:var(--muted)}

/* khung trang */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:84px 1fr;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
.rail{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 0;border-radius:26px;background:rgba(255,255,255,.035);border:1px solid var(--glass-line)}
.logo{width:48px;height:48px;border-radius:15px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px rgba(54,214,196,.3)}
.rail-nav{display:flex;flex-direction:column;gap:8px;flex:1}
.rail-nav button{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:var(--muted);position:relative}
.rail-nav button:hover{background:var(--glass-2)}
.rail-nav button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(54,214,196,.35)}
.rail-nav button span{display:none}
.rail-add{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;border:1.5px dashed rgba(54,214,196,.6);background:var(--accent-soft)}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}

/* đầu trang */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hello{margin:0;font-family:var(--display);font-size:clamp(20px,3vw,26px);font-weight:500;color:var(--muted);letter-spacing:-.01em}
.hello b{color:var(--ink);font-weight:700}
.sub-hello{margin:2px 0 0;font-size:13px;color:var(--faint)}
.top-actions{display:flex;align-items:center;gap:10px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--glass-line);position:relative}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--out);color:#200805;font-size:11px;font-weight:800;display:grid;place-items:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:var(--accent-ink);font-weight:800;font-family:var(--display);font-size:17px;text-transform:uppercase}
.demo-bar,.note{padding:12px 16px;border-radius:16px;background:var(--accent-soft);border:1px solid rgba(54,214,196,.3);font-size:13.5px}
.note{background:var(--out-soft);border-color:rgba(255,139,123,.35)}

/* chọn kỳ */
.controls{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-grid;grid-template-columns:repeat(3,auto);padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-line)}
.seg button{padding:9px 20px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--grad);color:var(--accent-ink)}
.period{display:flex;align-items:center;gap:10px}
.period .nav{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-line)}
.period .nav svg{width:18px;height:18px}
.period-mid{text-align:center;min-width:150px}
.period-mid h2{margin:0;font-family:var(--display);font-size:17px;font-weight:600}
.period-mid p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.today-btn{color:var(--accent);font-weight:700;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

/* lưới nội dung */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero-row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}

/* thẻ lớn */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:var(--hero-grad);border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:14px;min-height:250px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);pointer-events:none}
.hero::after{content:"";position:absolute;right:30px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(255,255,255,.06);pointer-events:none}
.hero-art{position:absolute;right:18px;top:18px;opacity:.95}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.88);color:#0C2A2B;font-size:12px;font-weight:700}
.hero-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(231,243,241,.72);font-weight:600}
.hero-num{font-family:var(--display);font-size:clamp(32px,5vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.02;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;position:relative}
.hero-num small{font-size:.45em;font-weight:500;margin-left:5px;color:rgba(231,243,241,.7)}
.hero-chips{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.hero-chip{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:16px;background:rgba(4,20,24,.35);border:1px solid rgba(255,255,255,.12);min-width:0}
.hero-chip span{font-size:12px;color:rgba(231,243,241,.7);display:flex;align-items:center;gap:6px}
.hero-chip b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-chip.in b{color:var(--in)} .hero-chip.out b{color:var(--out)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.in .dot{background:var(--in)} .out .dot{background:var(--out)}
.hero-cmp{font-size:12.5px;color:rgba(231,243,241,.75);position:relative;margin-top:auto}
.hero-cmp b{color:var(--ink)}

/* hạn mức (danh sách thẻ nhỏ như cột phải ảnh mẫu) */
.bg-list{display:flex;flex-direction:column;gap:10px}
.bg-row{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;width:100%;padding:10px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-line)}
.bg-row:hover{background:var(--glass-2);border-color:var(--glass-hi)}
.bg-row em{font-style:normal;color:var(--muted);font-weight:500;font-size:12px}
.bg-note{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini-add{color:var(--accent);font-weight:700;font-size:13px;padding:4px 2px}
.lv-warn .track i{background:var(--warn)} .lv-warn .bg-note{color:var(--warn);font-weight:600}
.lv-over .track i{background:var(--out)} .lv-over .bg-note{color:var(--out);font-weight:700}
.lv-over.bg-row{border-color:rgba(255,139,123,.45)} .lv-warn.bg-row{border-color:rgba(242,196,107,.4)}
.remind{padding:12px 16px;border-radius:18px;background:var(--warn-soft);border:1px solid rgba(242,196,107,.45);font-size:13.5px;display:flex;gap:12px;align-items:flex-start}
.remind.lv-over{background:var(--out-soft);border-color:rgba(255,139,123,.5)}
.remind ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}

/* biểu đồ */
.chart svg{display:block;width:100%;height:auto}
.chart .grid-l{stroke:rgba(255,255,255,.07);stroke-width:1}
.chart .ylab,.chart .xlab{fill:var(--faint);font-size:10.5px;font-family:var(--font)}
.chart .bar{fill:url(#barGrad);opacity:.75}
.chart .bar.zero{fill:rgba(255,255,255,.08);opacity:1}
.chart .bar.is-today{opacity:1}
.chart .xlab.is-today{fill:var(--ink);font-weight:700}
.chart .avg{stroke:var(--warn);stroke-width:1.4;stroke-dasharray:4 4}
.chart .avg-lab{fill:var(--warn);font-size:10.5px;font-weight:700;font-family:var(--font)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover + .bar{opacity:1}

/* thống kê vòng tròn */
.donut-wrap{position:relative;display:grid;place-items:center;padding:6px 0}
.donut-wrap svg{width:min(240px,100%);height:auto;filter:drop-shadow(0 10px 30px rgba(54,214,196,.18))}
.donut-mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-mid small{display:block;font-size:12px;color:var(--muted)}
.donut-mid b{display:block;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bubbles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bubble{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);text-align:center;min-width:0}
.bubble .ci{width:50px;height:50px;border-radius:16px}
.bubble b{color:var(--ink);font-size:13.5px;font-variant-numeric:tabular-nums}
.mini-seg{display:inline-flex;gap:4px;padding:3px;border-radius:11px;background:var(--glass);border:1px solid var(--glass-line)}
.mini-seg button{padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.mini-seg button[aria-pressed="true"]{background:var(--grad);color:var(--accent-ink)}

/* danh mục */
.cats-list{display:flex;flex-direction:column;gap:12px}
.cat-row{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:10px}
.ci{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 30%,transparent)}
.cat-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.cat-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.cat-top span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-top b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;display:block}
.track i{display:block;height:100%;border-radius:99px;background:var(--cc)}
.pct{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;margin:0}

/* sổ ghi */
.ledger{display:flex;flex-direction:column;gap:6px}
.day-head{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 4px 2px}
.day-head:first-child{padding-top:0}
.tx{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:10px 12px;text-align:left;border-radius:16px;width:100%;background:var(--glass);border:1px solid transparent}
.tx:hover{border-color:var(--glass-hi);background:var(--glass-2)}
.tx-main{min-width:0;display:flex;flex-direction:column}
.tx-cat{font-weight:600;font-size:14.5px}
.tx-note{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.in,.amt-in{color:var(--in)} .tx-amt.out,.amt-out{color:var(--out)}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink)}
.skel{height:14px;border-radius:7px;background:rgba(255,255,255,.07);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.credit{font-size:11.5px;color:var(--faint);text-align:center;padding-top:4px}
.credit a{color:var(--muted)}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;padding:13px 16px;border-radius:14px;font-weight:700;font-size:15px;text-align:center}
.btn.primary{background:var(--grad);color:var(--accent-ink);box-shadow:0 10px 26px rgba(34,169,194,.28)}
.btn.primary:disabled{opacity:.6;cursor:wait}
.btn.ghost{flex:0 0 auto;background:var(--glass-2);border:1px solid var(--glass-line)}
.btn.danger{color:var(--out)}
.btn.danger.armed{background:var(--out);color:#200805;border-color:var(--out)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn{font-size:13.5px;padding:12px 8px;flex:auto}
label.btn,label.link{cursor:pointer}
.stack{display:flex;flex-direction:column;gap:12px}
.ok{margin:0;color:var(--in);font-size:13.5px;font-weight:600}
.err{margin:0;color:var(--out);font-size:13.5px;font-weight:600}

/* form trong sheet / thẻ */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;animation:fade .18s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:92vh;overflow:auto;z-index:31;background:rgba(12,28,31,.92);border:1px solid var(--glass-line);border-bottom:0;border-radius:26px 26px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}
.grip{width:40px;height:4px;border-radius:9px;background:var(--glass-hi);margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-family:var(--display);font-size:19px;font-weight:600}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass-2)}
.icon-btn svg{width:18px;height:18px}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind button{padding:11px 0;border-radius:13px;font-weight:700;border:1.5px solid var(--glass-line);color:var(--muted)}
.kind button[data-k="chi"][aria-pressed="true"]{background:var(--out-soft);border-color:var(--out);color:var(--out)}
.kind button[data-k="thu"][aria-pressed="true"]{background:var(--in-soft);border-color:var(--in);color:var(--in)}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--glass-line);padding-bottom:6px}
.amt:focus-within{border-color:var(--accent)}
.amt input{flex:1;min-width:0;border:0;background:none;font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;outline:none;padding:0}
.amt span{font-size:20px;font-weight:700;color:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{padding:7px 11px;border-radius:10px;background:var(--glass-2);border:1px solid var(--glass-line);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1.5px solid transparent;font-size:12.5px;font-weight:600;color:var(--muted)}
.pick button[aria-pressed="true"]{border-color:var(--cc);color:var(--ink);background:color-mix(in srgb,var(--cc) 10%,transparent)}
.fields{display:grid;grid-template-columns:1fr 160px;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.field input{padding:12px 13px;border-radius:13px;border:1px solid var(--glass-line);background:rgba(255,255,255,.05);font-size:15px;font-weight:500;color:var(--ink);min-width:0;width:100%}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(54,214,196,.18)}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:min(92vw,460px);bottom:calc(96px + env(safe-area-inset-bottom,0px));padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;z-index:40;box-shadow:var(--shadow);animation:fade .2s ease-out}
.toast.lv-warn{background:var(--warn);color:var(--on-warn)} .toast.lv-over{background:var(--out);color:#200805}

/* màn hình đăng nhập */
.gate{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- danh mục ----------

const UI = {
  prev: P('<path d="M15 5l-7 7 7 7"/>'),

};

// ---------- tiền & ngày ----------
const NF = new Intl.NumberFormat('vi-VN');
const money = (n) => NF.format(Math.round(n)) + ' ₫';
const MINUS = '−';
const trim1 = (x) => (Math.round(x * 10) / 10).toString().replace('.', ',');
const short = (n) => n >= 1e9 ? trim1(n / 1e9) + ' tỷ' : n >= 1e6 ? trim1(n / 1e6) + 'tr' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n));
const WD = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const WDS = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const dm = (d) => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
function isoWeek(d) {
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const w1 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
}
function rangeOf(view, a) {
  if (view === 'day') return [a, a];
  if (view === 'week') { const s = addDays(a, -((a.getDay() + 6) % 7)); return [s, addDays(s, 6)]; }
  return [new Date(a.getFullYear(), a.getMonth(), 1), new Date(a.getFullYear(), a.getMonth() + 1, 0)];
}
function shifted(view, a, dir) {
  if (view === 'day') return addDays(a, dir);
  if (view === 'week') return addDays(a, 7 * dir);
  const last = new Date(a.getFullYear(), a.getMonth() + dir + 1, 0).getDate();
  return new Date(a.getFullYear(), a.getMonth() + dir, Math.min(a.getDate(), last));
}
const daysBetween = (s, e) => { const out = []; for (let d = s; d <= e; d = addDays(d, 1)) out.push(d); return out; };

// ---------- mã hóa (PIN -> khóa AES-GCM, dữ liệu được mã hóa trước khi lưu) ----------
const te = new TextEncoder(), td = new TextDecoder();
const b64 = (buf) => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveKey(pin, salt, iter, extractable = false) {

  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, extractable, ['encrypt', 'decrypt']);

  return { iv: b64(iv), c: b64(c) };
}

  return JSON.parse(td.decode(p));
}
const ITER = 250000;
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
const importData = (raw) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function encRaw(key, bytes) {
  const iv = rand(12);
  return { iv: b64(iv), c: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes)) };
}
async function decRaw(key, box) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.c)));
}
// Mã khôi phục: 16 ký tự, bỏ các chữ dễ nhầm (0/O, 1/I/L)
const ALPH = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function genCode() {
  let out = '';
  while (out.length < 16) for (const b of rand(32)) if (b < 248 && out.length < 16) out += ALPH[b % 31];
  return out.match(/.{4}/g).join('-');
}
const normCode = (s) => String(s).toUpperCase().replace(/[^0-9A-Z]/g, '');
// Sổ dùng một khóa dữ liệu ngẫu nhiên; khóa này được bọc 2 lần: bằng mã PIN và bằng mã khôi phục
async function buildVault(raw, dataKey, pin, code) {
  const salt = rand(16), rsalt = rand(16);
  const [pinKey, recKey] = await Promise.all([deriveKey(pin, salt, ITER), deriveKey(normCode(code), rsalt, ITER)]);
  return {
    v: 2, iter: ITER, riter: ITER, salt: b64(salt), rsalt: b64(rsalt),
    pinWrap: await encRaw(pinKey, raw), recWrap: await encRaw(recKey, raw),
    recBox: await seal(dataKey, { code }), check: await seal(dataKey, { ok: 1 }),
    created: (vault && vault.created) || Date.now(), updated: Date.now(),
  };
}
async function pinFields(raw, pin) {
  const salt = rand(16);
  return { salt: b64(salt), iter: ITER, pinWrap: await encRaw(await deriveKey(pin, salt, ITER), raw), updated: Date.now() };
}

// ---------- trạng thái ----------
const S = {
  gate: 'boot', gateMsg: '', gateErr: '', busy: false,
  demo: false, key: null, raw: null, tx: new Map(), loading: true, stale: false, loadErr: '', gen: 0,
  recCode: '', pending: null, panel: '', shownCode: '', panelErr: '', panelMsg: '',
  bg: new Map(), bpanel: null, bErr: '', gateNote: '',
  view: 'week', anchor: today(), bk: 'chi',
};
try { const v = localStorage.getItem('stc.view'); if (['day', 'week', 'month'].includes(v)) S.view = v; } catch {}
let db = null, vaultRef = null, txCol = null, bgCol = null, vault = null, unsub = null, unsubBg = null, loadTimer = null;

// ---------- lưu ngay trong máy (localStorage), không gửi đi đâu ----------
const PFX = 'gc1:';
function lsKeys() { const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PFX)) out.push(k.slice(PFX.length)); } return out; }
function localDB() {
  const listeners = new Set();
  const read = (p) => { const s = localStorage.getItem(PFX + p); return s ? JSON.parse(s) : null; };
  const write = (p, v) => { try { localStorage.setItem(PFX + p, JSON.stringify(v)); } catch { throw { code: 'quota_exceeded' }; } };
  const depth = (p) => p.split('/').length;
  const notify = () => setTimeout(() => listeners.forEach((f) => f()), 0);
  addEventListener('storage', notify);
  const snap = (k, v) => ({ id: k.split('/').pop(), exists: v != null, data: () => (v == null ? undefined : v), metadata: { fromCache: false, hasPendingWrites: false } });
  const kids = (path) => lsKeys().filter((k) => k.startsWith(path + '/') && depth(k) === depth(path) + 1).sort();
  const doc = (path) => ({
    id: path.split('/').pop(), path,
    async get() { return snap(path, read(path)); },
    async set(d) { write(path, d); notify(); },
    async update(d) { const cur = read(path); if (!cur) throw { code: 'invalid_argument' }; write(path, { ...cur, ...d }); notify(); },
    async delete() { localStorage.removeItem(PFX + path); notify(); },
    collection: (p) => col(path + '/' + p),
  });
  const col = (path) => ({
    path,
    doc: (id) => doc(path + '/' + (id || Date.now().toString(36) + Math.random().toString(36).slice(2, 8))),
    async get() { return { docs: kids(path).map((k) => snap(k, read(k))) }; },
    onSnapshot(next) {
      let prev = new Map();
      const fire = () => {
        const cur = new Map(kids(path).map((k) => [k, localStorage.getItem(PFX + k)]));
        const ch = [];
        for (const [k, s] of cur) if (prev.get(k) !== s) ch.push({ type: prev.has(k) ? 'modified' : 'added', doc: snap(k, JSON.parse(s)) });
        for (const [k, s] of prev) if (!cur.has(k)) ch.push({ type: 'removed', doc: snap(k, JSON.parse(s)) });
        prev = cur;
        if (ch.length || !fire.done) { fire.done = true; next({ docs: [], docChanges: () => ch, metadata: { fromCache: false } }); }
      };
      listeners.add(fire); setTimeout(fire, 0);
      return () => listeners.delete(fire);
    },
  });
  return { doc, collection: col };
}

// ---------- sao lưu / khôi phục bằng file (file đã mã hóa, cần PIN hoặc mã khôi phục để mở) ----------
function exportBackup() {
  const items = {};
  for (const k of lsKeys()) items[k] = JSON.parse(localStorage.getItem(PFX + k));
  const blob = new Blob([JSON.stringify({ app: 'ghi-chu', v: 1, at: new Date().toISOString(), items })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ghi-chu-sao-luu-${ymd(today())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  try { localStorage.setItem('gc.lastBackup', String(Date.now())); } catch {}
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { throw new Error('File này không đọc được. Chọn đúng file ghi-chu-sao-luu-….json.'); }
  if (!data || data.app !== 'ghi-chu' || !data.items || !data.items['so/vault']) throw new Error('Đây không phải file sao lưu của sổ này.');
  for (const k of lsKeys()) localStorage.removeItem(PFX + k);
  try { for (const [k, v] of Object.entries(data.items)) localStorage.setItem(PFX + k, JSON.stringify(v)); }
  catch { throw new Error('Bộ nhớ trình duyệt không đủ chỗ để nhập file này.'); }
}
async function afterImport() {

  S.key = null; S.raw = null; S.tx = new Map(); S.panel = ''; closeSheet();
  vault = (await vaultRef.get()).data();
  S.gate = 'unlock'; S.gateErr = ''; S.gateNote = 'Đã nhập file sao lưu. Đăng nhập bằng tài khoản của sổ trong file đó.';

}
async function retryOnce(fn) {
  try { return await fn(); } catch (e) {
    if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 600); return fn(); }

  }
}
function errText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Bộ nhớ trình duyệt đã đầy. Sao lưu ra file rồi xóa bớt các khoản cũ.';
  return 'Không lưu được. Thử lại.';
}

async function boot() {
  S.gate = 'boot'; S.gateErr = ''; render();
  if (!(window.crypto && crypto.subtle)) { S.gate = 'nodb'; S.gateMsg = 'Trình duyệt này không hỗ trợ mã hóa dữ liệu. Mở bằng Chrome hoặc Safari bản mới.'; return render(); }
  try { localStorage.setItem(PFX + '_t', '1'); localStorage.removeItem(PFX + '_t'); }
  catch { S.gate = 'nodb'; S.gateMsg = 'Trình duyệt đang chặn lưu dữ liệu (có thể đang ở chế độ ẩn danh). Mở bằng tab thường.'; return render(); }

  db = localDB();

  bgCol = vaultRef.collection('bg');
  const snap = await vaultRef.get();

}

function showRecCode(code, key, raw, upgraded) {
  S.gate = 'reccode'; S.recCode = code; S.pending = { key, raw }; S.recUpgraded = !!upgraded; S.gateErr = '';
  render();
}
const normUser = (s) => String(s).trim().toLowerCase();
// Hạn mức tạo sẵn theo yêu cầu: tháng
const DEFAULT_BUDGETS = [
  { cat: 'an', amt: 1000000, per: 'month' },
  { cat: 'caulong', amt: 500000, per: 'month' },
  { cat: 'muasam', amt: 500000, per: 'month' },
];
async function createPin(pin, user) {
  const raw = rand(32), dataKey = await importData(raw), code = genCode();
  const v = { ...(await buildVault(raw, dataKey, pin, code)), user: normUser(user) };
  await retryOnce(() => vaultRef.set(v));
  vault = v;
  for (const b of DEFAULT_BUDGETS) await bgCol.doc().set(await seal(dataKey, { ...b, ts: Date.now() }));
  showRecCode(code, dataKey, raw, false);

async function unlock(pin, user) {
  if (vault.user && normUser(user) !== vault.user) return false;
  if (vault.v === 2) {
    let raw;
    try { raw = await decRaw(await deriveKey(pin, unb64(vault.salt), vault.iter || ITER), vault.pinWrap); } catch { return false; }
    enterApp(await importData(raw), raw);
    return true;
  }
  // Sổ tạo từ bản đầu (chưa có mã khôi phục): mở bằng khóa cũ rồi nâng cấp, dữ liệu giữ nguyên

// ---------- hạn mức chi tiêu + nhắc nhở ----------
const PER_WORD = { day: 'ngày', week: 'tuần', month: 'tháng' };
const cap = (s) => s[0].toUpperCase() + s.slice(1);
function budgetStatus(b, anchor) {
  const [s, e] = rangeOf(b.per, anchor); const a = ymd(s), z = ymd(e);
  let spent = 0;
  for (const t of S.tx.values()) if (t.k === 'chi' && t.cat === b.cat && t.d >= a && t.d <= z) spent += t.a;
  const pct = b.amt ? spent / b.amt : 0;
  return { spent, pct, left: b.amt - spent, level: pct >= 1 ? 'over' : pct >= 0.8 ? 'warn' : 'ok' };
}
const budgetsSorted = () => [...(S.bg || new Map()).values()].sort((x, y) => (x.ts || 0) - (y.ts || 0));
function remindLines(anchor) {
  return budgetsSorted().map((b) => ({ b, st: budgetStatus(b, anchor) })).filter((x) => x.st.level !== 'ok');
}
function remindBanner() {
  const items = remindLines(today());
  if (!items.length) return '';
  const over = items.some((x) => x.st.level === 'over');
  return `<div class="remind lv-${over ? 'over' : 'warn'}" role="status">${li('bell', { size: 30, trigger: 'loop', delay: 2500, secondary: over ? '#ff8b7b' : '#f2c46b' })}<div><b>Nhắc nhở hạn mức</b><ul>${items.map(({ b, st }) => `<li>${esc(CAT_NAME[b.cat] || b.cat)}: ${st.level === 'over'
    ? `đã chi ${money(st.spent)}, <b>vượt ${money(-st.left)}</b> hạn mức ${PER_WORD[b.per]} này`
    : `đã dùng ${Math.round(st.pct * 100)}% hạn mức ${PER_WORD[b.per]} này, còn ${money(st.left)}`}</li>`).join('')}</ul></div></div>`;
}
function budgetForm() {
  const p = S.bpanel;
  return `<form id="budgetForm" class="stack" novalidate>
    <div class="field">Danh mục<div class="pick">${CATS.chi.map(([id, name]) => `<button type="button" data-act="bcat" data-c="${id}" aria-pressed="${p.cat === id}" style="--cc:${ccVar(id)}"><span class="ci">${ICON[id]}</span>${name}</button>`).join('')}</div></div>
    <label class="field">Chi tối đa (đồng)<input id="bAmt" inputmode="numeric" value="${p.amt ? NF.format(p.amt) : ''}" placeholder="VD: 1.000.000"></label>
    <div class="field">Tính theo<div class="mini-seg" style="align-self:flex-start">${['day', 'week', 'month'].map((v) => `<button type="button" data-act="bper" data-v="${v}" aria-pressed="${p.per === v}">${cap(PER_WORD[v])}</button>`).join('')}</div></div>
    ${S.bErr ? `<p class="err">${esc(S.bErr)}</p>` : ''}
    <div class="actions">${p.id ? `<button type="button" class="btn ghost danger${p.armed ? ' armed' : ''}" data-act="bdel">${p.armed ? 'Bấm lần nữa để xóa' : 'Xóa'}</button>` : ''}<button type="button" class="btn ghost" data-act="bcancel">Hủy</button><button type="submit" class="btn primary">Lưu hạn mức</button></div>
  </form>`;
}
function budgetCard() {
  const list = budgetsSorted();
  let body;
  if (S.bpanel) body = budgetForm();
  else if (!list.length) body = `<p class="pct" style="text-align:left">Chưa có hạn mức nào. Đặt hạn mức để được nhắc khi sắp chi quá tay.</p>`;
  else body = `<div class="bg-list">${list.map((b) => {
    const st = budgetStatus(b, S.anchor);
    return `<button class="bg-row lv-${st.level}" data-act="bedit" data-id="${esc(b.id)}" style="--cc:${ccVar(b.cat)}"><span class="ci">${catIcon(b.cat, 26, '.bg-row')}</span><span class="cat-main"><span class="cat-top"><span>${esc(CAT_NAME[b.cat] || b.cat)}</span><b>${short(st.spent)} / ${short(b.amt)}</b></span><span class="track"><i style="width:${Math.min(100, st.pct * 100).toFixed(1)}%"></i></span><span class="bg-note">${st.level === 'over' ? `Vượt ${money(-st.left)}` : `Còn ${money(st.left)}`} · ${Math.round(st.pct * 100)}% · theo ${PER_WORD[b.per]}</span></span></button>`;
  }).join('')}</div><p class="pct" style="text-align:left">Chạm vào một hạn mức để sửa hoặc xóa. Nhắc khi chi tới 80%.</p>`;
  return `<section class="card" id="budgets"><div class="card-head"><h3>${S.bpanel ? (S.bpanel.id ? 'Sửa hạn mức' : 'Thêm hạn mức') : 'Hạn mức chi tiêu'}</h3>${S.bpanel ? '' : `<button class="mini-add" data-act="badd">+ Thêm hạn mức</button>`}</div>${body}</section>`;

async function saveBudget() {
  const p = S.bpanel;
  p.amt = Number(digits(($('#bAmt') || {}).value || '') || 0);
  if (!p.amt) { S.bErr = 'Nhập số tiền tối đa lớn hơn 0.'; return render(); }
  const dup = budgetsSorted().find((b) => b.cat === p.cat && b.per === p.per && b.id !== p.id);
  if (dup) { S.bErr = `Đã có hạn mức ${CAT_NAME[p.cat]} theo ${PER_WORD[p.per]}. Chạm vào nó để sửa.`; return render(); }
  const obj = { cat: p.cat, amt: p.amt, per: p.per, ts: p.ts || Date.now() };
  try {
    let id = p.id;
    if (S.demo) id = id || 'b' + Date.now();
    else { const ref = id ? bgCol.doc(id) : bgCol.doc(); id = ref.id; await ref.set(await seal(S.key, obj)); }
    S.bg.set(id, { ...obj, id });
    S.bpanel = null; S.bErr = ''; render();
  } catch (e) { S.bErr = errText(e); render(); }
}
let toastT;

// ---------- form thêm / sửa ----------
const F = { id: null, k: 'chi', cat: 'an', ts: 0 };
const fAmt = $('#fAmt'), fNote = $('#fNote'), fDate = $('#fDate'), fErr = $('#fErr'), fDel = $('#fDel'), fSave = $('#fSave');
const digits = (s) => String(s).replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 13);
const setAmt = (n) => { fAmt.value = n ? NF.format(n) : ''; };
const getAmt = () => Number(digits(fAmt.value) || 0);
function paintForm() {
  $('#kChi').setAttribute('aria-pressed', F.k === 'chi');
  $('#kThu').setAttribute('aria-pressed', F.k === 'thu');
  $('#fCats').innerHTML = CATS[F.k].map(([id, name]) => `<button type="button" data-act="cat" data-c="${id}" aria-pressed="${F.cat === id}" style="--cc:${ccVar(id)}"><span class="ci">${ICON[id]}</span>${name}</button>`).join('');
  fSave.textContent = F.id ? 'Lưu thay đổi' : F.k === 'chi' ? 'Lưu khoản chi' : 'Lưu khoản thu';
}
function openSheet(tx) {
  F.id = tx ? tx.id : null; F.k = tx ? tx.k : 'chi'; F.cat = tx ? tx.cat : 'an'; F.ts = tx ? tx.ts : 0;
  setAmt(tx ? tx.a : 0); fNote.value = tx ? tx.note || '' : '';
  fDate.value = tx ? tx.d : ymd(S.view === 'day' ? S.anchor : today());
  $('#sheetTitle').textContent = tx ? 'Sửa khoản' : 'Thêm khoản';
  fDel.hidden = !tx; fDel.classList.remove('armed'); fDel.textContent = 'Xóa';
  fErr.hidden = true; fSave.disabled = false;
  paintForm();
  $('#scrim').hidden = false; $('#sheet').hidden = false;
  if (!tx) setTimeout(() => fAmt.focus(), 60);
}
function closeSheet() { $('#scrim').hidden = true; $('#sheet').hidden = true; }
function showErr(m) { fErr.textContent = m; fErr.hidden = false; }

fAmt.addEventListener('input', () => setAmt(getAmt()));
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'bAmt') { const n = Number(digits(ev.target.value) || 0); ev.target.value = n ? NF.format(n) : ''; }
});
$('#sheet').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const a = getAmt();
  if (!a) return showErr('Nhập số tiền lớn hơn 0.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(fDate.value)) return showErr('Chọn ngày cho khoản này.');
  const tx = { k: F.k, a, cat: F.cat, note: fNote.value.trim().slice(0, 80), d: fDate.value, ts: F.ts || Date.now() };
  fSave.disabled = true;
  try {
    if (S.demo) { const id = F.id || 'm' + Date.now(); S.tx.set(id, { ...tx, id }); }
    else {
      const ref = F.id ? txCol.doc(F.id) : txCol.doc();
      const box = await seal(S.key, tx);
      await retryOnce(() => ref.set(box));
      S.tx.set(ref.id, { ...tx, id: ref.id });
    }
    S.anchor = parse(tx.d);
    closeSheet(); render();
    if (tx.k === 'chi') {
      const hit = remindLines(parse(tx.d)).filter((x) => x.b.cat === tx.cat).sort((a, b) => b.st.pct - a.st.pct)[0];
      if (hit) {
        const nm = CAT_NAME[tx.cat], per = PER_WORD[hit.b.per];
        showToast(hit.st.level === 'over'
          ? `${nm}: đã vượt hạn mức ${per} ${money(-hit.st.left)}`
          : `${nm}: đã dùng ${Math.round(hit.st.pct * 100)}% hạn mức ${per}, còn ${money(hit.st.left)}`, hit.st.level);
      }
    }
  } catch (e) { showErr(errText(e)); fSave.disabled = false; }
});

// ---------- sự kiện ----------
document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'view') { S.view = b.dataset.v; try { localStorage.setItem('stc.view', S.view); } catch {} render(); }
  else if (act === 'shift') { S.anchor = shifted(S.view, S.anchor, Number(b.dataset.dir)); render(); }
  else if (act === 'today') { S.anchor = today(); render(); }
  else if (act === 'pickday') { S.anchor = parse(b.dataset.d); S.view = 'day'; render(); }
  else if (act === 'bk') { S.bk = b.dataset.k; render(); }
  else if (act === 'add') openSheet(null);
  else if (act === 'edit') { const tx = S.tx.get(b.dataset.id); if (tx) openSheet(tx); }
  else if (act === 'close') closeSheet();
  else if (act === 'kind') { F.k = b.dataset.k; F.cat = CATS[F.k][0][0]; paintForm(); }
  else if (act === 'cat') { F.cat = b.dataset.c; paintForm(); }
  else if (act === 'q') {
    const v = b.dataset.v, cur = getAmt();
    if (v === 'clear') setAmt(0); else if (v === 'x1000') setAmt(cur ? cur * 1000 : 0); else setAmt(cur + Number(v));
  }
  else if (act === 'del') {
    if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Bấm lần nữa để xóa'; return; }
    try {
      if (!S.demo) await retryOnce(() => txCol.doc(F.id).delete());
      S.tx.delete(F.id); closeSheet(); render();
    } catch (e) { showErr(errText(e)); }
  }
  else if (act === 'lock') lock();
  else if (act === 'demo') startDemo();
  else if (act === 'retry') boot();
  else if (act === 'forgot') { S.gate = 'forgot'; S.gateErr = ''; render(); }
  else if (act === 'go') {
    S.nav = b.dataset.t; render();
    const el = document.getElementById(S.nav);
    if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  else if (act === 'badd') {
    const used = new Set(budgetsSorted().filter((x) => x.per === 'month').map((x) => x.cat));
    const free = CATS.chi.find(([id]) => !used.has(id));
    S.bpanel = { id: null, cat: free ? free[0] : 'an', amt: 0, per: 'month' }; S.bErr = ''; render();
    const c = $('#budgets'); if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  else if (act === 'bedit') { const x = S.bg.get(b.dataset.id); if (x) { S.bpanel = { ...x }; S.bErr = ''; render(); } }
  else if (act === 'bcat' || act === 'bper') {
    S.bpanel.amt = Number(digits(($('#bAmt') || {}).value || '') || 0);
    if (act === 'bcat') S.bpanel.cat = b.dataset.c; else S.bpanel.per = b.dataset.v;
    S.bpanel.armed = false; render();
  }
  else if (act === 'bcancel') { S.bpanel = null; S.bErr = ''; render(); }
  else if (act === 'bdel') {
    if (!S.bpanel.armed) { S.bpanel.amt = Number(digits(($('#bAmt') || {}).value || '') || 0); S.bpanel.armed = true; return render(); }
    try { if (!S.demo) await bgCol.doc(S.bpanel.id).delete(); S.bg.delete(S.bpanel.id); S.bpanel = null; render(); }
    catch (e) { S.bErr = errText(e); render(); }
  }
  else if (act === 'backup') { exportBackup(); S.panelMsg = 'Đã tạo file sao lưu. Cất file ở nơi an toàn (Drive riêng, Zalo Cloud của bạn…).'; render(); }
  else if (act === 'wipeask') { S.gate = 'wipe'; S.gateErr = ''; render(); }
  else if (act === 'reccontinue') {
    const ok = $('#recOk');
    if (!ok || !ok.checked) { S.gateErr = 'Đánh dấu ô "Tôi đã lưu mã khôi phục" trước khi vào sổ.'; return render(); }
    const p = S.pending; S.pending = null; S.recCode = '';
    enterApp(p.key, p.raw);
  }
  else if (act === 'copycode') {
    const code = b.dataset.code;
    try { await navigator.clipboard.writeText(code); b.textContent = 'Đã chép mã'; }
    catch {
      const el = b.parentElement.querySelector('.code') || $('.code');
      if (el) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      b.textContent = 'Đã bôi đen, hãy tự chép';
    }
  }
  else if (act === 'panel') { S.panel = b.dataset.p; S.panelErr = ''; S.panelMsg = ''; S.shownCode = ''; render(); }
  else if (act === 'showcode') {
    try { S.shownCode = (await unseal(S.key, vault.recBox)).code; S.panel = 'code'; } catch { S.panelMsg = 'Không đọc được mã khôi phục.'; }
    render();
  }
  else if (act === 'back') { S.gate = 'unlock'; S.gateErr = ''; render(); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  const h = ev.target.closest && ev.target.closest('.hit');
  if (h && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); h.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('submit', async (ev) => {
  const f = ev.target;
  if (f.id === 'budgetForm') { ev.preventDefault(); return saveBudget(); }
  if (f.id === 'panelForm') {
    ev.preventDefault();
    const a = $('#np1').value, c = $('#np2').value;
    S.panelErr = '';
    if (a.length < 6) { S.panelErr = 'Mật khẩu cần ít nhất 6 ký tự.'; return render(); }
    if (a !== c) { S.panelErr = 'Hai lần nhập mật khẩu không khớp.'; return render(); }
    S.busy = true; render();
    try { await changePin(a); S.panel = ''; S.panelMsg = 'Đã đổi mật khẩu. Lần sau đăng nhập dùng mật khẩu mới.'; }
    catch (e) { S.panelErr = errText(e); }
    S.busy = false; render();
    return;
  }
  if (f.id !== 'gateForm') return;
  ev.preventDefault();
  const p1 = ($('#pin1') || {}).value || '', p2 = ($('#pin2') || {}).value || '', un = ($('#uname') || {}).value || '';
  const kind = f.dataset.kind;
  S.gateErr = '';
  if (kind === 'setup') {
    if (normUser(un).length < 3) { S.gateErr = 'Tên đăng nhập cần ít nhất 3 ký tự.'; return render(); }
    if (p1.length < 6) { S.gateErr = 'Mật khẩu cần ít nhất 6 ký tự.'; return render(); }
    if (p1 !== p2) { S.gateErr = 'Hai lần nhập mật khẩu không khớp.'; return render(); }
    S.busy = true; render();
    try { await createPin(p1, un); } catch (e) { S.gate = 'setup'; S.gateErr = errText(e); }
    S.busy = false; render();
  } else if (kind === 'unlock') {
    if (!p1 || !un) { S.gateErr = 'Nhập đủ tên đăng nhập và mật khẩu.'; return render(); }
    S.busy = true; render();
    const ok = await unlock(p1, un).catch(() => false);
    S.busy = false;
    if (!ok) { await sleep(800); S.gateErr = 'Tên đăng nhập hoặc mật khẩu chưa đúng.'; }
    render();
    if (!ok) { const i = $('#uname'); if (i) { i.value = un; $('#pin1').focus(); } }
  } else if (kind === 'recover') {
    const code = ($('#recIn') || {}).value || '';
    if (normCode(code).length !== 16) { S.gateErr = 'Mã khôi phục gồm 16 ký tự, dạng XXXX-XXXX-XXXX-XXXX.'; return render(); }
    if (p1.length < 6) { S.gateErr = 'Mật khẩu mới cần ít nhất 6 ký tự.'; return render(); }
    if (p1 !== p2) { S.gateErr = 'Hai lần nhập mật khẩu mới không khớp.'; return render(); }
    S.busy = true; render();
    let ok = false;
    try { ok = await recover(code, p1); } catch (e) { S.gateErr = errText(e); }
    S.busy = false;
    if (!ok && !S.gateErr) { await sleep(800); S.gateErr = 'Mã khôi phục chưa đúng. Kiểm tra lại từng ký tự.'; }
    if (ok) S.panelMsg = `Đã đặt mật khẩu mới. Tên đăng nhập của bạn: ${vault.user || ''}`;
    render();
  } else if (kind === 'wipe') {
    if (p1.trim().toUpperCase() !== 'XOA') { S.gateErr = 'Gõ đúng chữ XOA để xác nhận.'; return render(); }
    S.busy = true; render();
    try { await wipe(); } catch (e) { S.gateErr = errText(e); }
    S.busy = false; render();
  }
});

// Tự khóa khi rời trang quá 5 phút
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (S.gate === 'app' && !S.demo && hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000) lock();
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.gate === 'app') render(); }, 150); });

document.addEventListener('change', async (ev) => {
  if (ev.target.id !== 'importFile' || !ev.target.files[0]) return;
  try { await importBackup(ev.target.files[0]); await afterImport(); }
  catch (e) {
    if (S.gate === 'app') { S.panelErr = e.message || 'Không nhập được file.'; } else { S.gateErr = e.message || 'Không nhập được file.'; }
    render();
  }
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
})();
</script>
</body>
